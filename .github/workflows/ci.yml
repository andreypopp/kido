name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  TERM: xterm-256color
  HOMEBREW_NO_AUTO_UPDATE: 1

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install tmux dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libevent-dev libncurses-dev libutf8proc-dev \
            bison autoconf automake pkg-config

      - name: Install tmux dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install libevent ncurses utf8proc automake autoconf pkg-config

      - name: Resolve tmux fork revision
        id: tmux-fork
        run: |
          sha=$(git ls-remote https://github.com/andreypopp/tmux.git refs/heads/side-pane | cut -f1)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # restore/save rather than actions/cache: a failing job must still
      # save the build it just paid for.
      - name: Restore tmux fork build
        id: tmux-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/tmux-side
          key: tmux-side-${{ runner.os }}-${{ steps.tmux-fork.outputs.sha }}

      - name: Build and install tmux fork
        if: steps.tmux-cache.outputs.cache-hit != 'true'
        run: ./scripts/install-tmux-fork.sh "$HOME/tmux-side"

      - name: Save tmux fork build
        if: steps.tmux-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/tmux-side
          key: tmux-side-${{ runner.os }}-${{ steps.tmux-fork.outputs.sha }}

      - name: Check tmux fork
        run: $HOME/tmux-side/bin/tmux -V

      # test-ts.sh skips cleanly on a node it cannot use, and a runner's
      # preinstalled node is whatever it happens to be, so pin one and demand
      # the suite runs. 24 rather than the 22.18 where unflagged TypeScript
      # landed: 22.18 parses the files and then its test runner cancels the
      # suite, which this pin is how we learned.
      - name: Set up node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Unit tests
        run: KIDO_TS_TEST_REQUIRED=1 make test

      - name: E2E tests
        run: KIDO_TMUX=$HOME/tmux-side/bin/tmux KIDO_E2E_REQUIRED=1 make e2e
