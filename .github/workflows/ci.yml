name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  TERM: xterm-256color
  HOMEBREW_NO_AUTO_UPDATE: 1

jobs:
  test:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      # ko_vt's dune rules build libghostty-vt with zig, and setup-dune's
      # "build" step runs the whole project, so zig must be on PATH before it.
      - name: Resolve zig key
        id: zig
        run: echo "key=$(./scripts/install-zig.sh --print-key)" >> "$GITHUB_OUTPUT"

      - name: Cache zig
        id: zig-cache
        uses: actions/cache@v4
        with:
          path: ~/zig
          key: zig-${{ runner.os }}-${{ runner.arch }}-${{ steps.zig.outputs.key }}

      - name: Install zig
        if: steps.zig-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: ./scripts/install-zig.sh "$HOME/zig"

      - name: Put zig on PATH
        run: echo "$HOME/zig" >> "$GITHUB_PATH"

      # The runner images ship rustup; this installs the toolchain that
      # rust-toolchain.toml pins. The Rust ko builds on macOS only for now.
      - name: Install the Rust toolchain
        if: runner.os == 'macOS'
        timeout-minutes: 5
        run: rustup toolchain install

      - name: Cache crates
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}

      # ko_vt_sys/build.rs keeps zig's caches here for every cargo profile.
      - name: Resolve ghostty pin
        if: runner.os == 'macOS'
        id: ghostty
        run: echo "pin=$(git ls-files -s third_party/ghostty | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"

      - name: Cache libghostty-vt
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: target/zig-cache
          key: zig-cache-${{ runner.os }}-${{ runner.arch }}-${{ steps.ghostty.outputs.pin }}-${{ steps.zig.outputs.key }}

      - name: Download crates
        if: runner.os == 'macOS'
        timeout-minutes: 5
        run: cargo fetch --locked

      # The Verus release archive (452 MB for arm64 macOS, 1.4 GB unpacked) that
      # `make verus` uses, keyed by the release in scripts/verus.sh.
      - name: Resolve Verus key
        if: runner.os == 'macOS'
        id: verus
        run: echo "key=$(./scripts/verus.sh --print-key)" >> "$GITHUB_OUTPUT"

      - name: Cache Verus
        if: runner.os == 'macOS'
        id: verus-cache
        uses: actions/cache@v4
        with:
          path: build/verus/${{ steps.verus.outputs.key }}
          key: verus-${{ runner.os }}-${{ runner.arch }}-${{ steps.verus.outputs.key }}

      - name: Fetch Verus
        if: runner.os == 'macOS' && steps.verus-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: ./scripts/verus.sh install "$PWD/build/verus/${{ steps.verus.outputs.key }}"

      # The dune binary distribution, pinned to the release the README
      # installs; there is no opam. `build-deps` builds dune.lock into
      # _build (the compiler included) and the action caches dune's shared
      # cache and _build across runs, so a lock that did not change costs a
      # restore, not a compiler build. Mosaic comes from the pins in
      # dune-project.
      - name: Set up dune
        uses: ocaml-dune/setup-dune@v2
        timeout-minutes: 20
        with:
          version: 3.24.2
          steps: install-dune build-deps

      # Go only drives the e2e suite, which stays in Go.
      - name: Set up Go
        uses: actions/setup-go@v5
        timeout-minutes: 5
        with:
          go-version-file: go.mod

      - name: Download Go modules
        timeout-minutes: 5
        run: go mod download

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          printf '%s\n' 'Acquire::Retries "3";' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' \
            | sudo tee /etc/apt/apt.conf.d/80-timeouts
          sudo apt-get update
          sudo apt-get install -y libevent-dev libncurses-dev libutf8proc-dev libpng-dev zlib1g-dev \
            bison autoconf automake pkg-config openssh-server zsh less procps
          # Debian's global compinit can block test shells with an insecure-directories prompt.
          echo 'skip_global_compinit=1' | sudo tee -a /etc/zsh/zshenv

      - name: Install tmux dependencies (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 10
        run: brew install libevent ncurses utf8proc libpng automake autoconf pkg-config

      - name: Resolve tmux fork build key
        id: tmux-fork
        run: |
          build_key=$(./scripts/install-tmux-fork.sh --print-build-key)
          echo "build-key=$build_key" >> "$GITHUB_OUTPUT"
      - name: Restore tmux fork build
        id: tmux-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/tmux-side
          key: tmux-side-${{ runner.os }}-${{ steps.tmux-fork.outputs.build-key }}

      - name: Build and install tmux fork
        if: steps.tmux-cache.outputs.cache-hit != 'true'
        run: ./scripts/install-tmux-fork.sh "$HOME/tmux-side"

      - name: Save tmux fork build
        if: steps.tmux-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/tmux-side
          key: tmux-side-${{ runner.os }}-${{ steps.tmux-fork.outputs.build-key }}

      - name: Check tmux fork
        run: $HOME/tmux-side/bin/kido-tmux -V

      # test-ts.sh skips cleanly on a node it cannot use, and a runner's
      # preinstalled node is whatever it happens to be, so pin one and demand
      # the suite runs. 24 rather than the 22.18 where unflagged TypeScript
      # landed: 22.18 parses the files and then its test runner cancels the
      # suite, which this pin is how we learned.
      - name: Set up node
        uses: actions/setup-node@v4
        timeout-minutes: 5
        with:
          node-version: '24'

      - name: Build
        run: dune build

      - name: Install
        run: make install PREFIX=$HOME/tmux-side && $HOME/tmux-side/bin/kido --version && test -x $HOME/tmux-side/share/kido/bin/tmux

      - name: Unit tests
        run: KIDO_TMUX=$HOME/tmux-side/bin/kido-tmux KO_CHECK_CONTRACTS=true dune test --force

      # "fork failed: Device not configured" from tmux on macOS runners reads as
      # pty exhaustion; this records the limit next to any such failure.
      - name: Pty limit
        if: runner.os == 'macOS'
        run: sysctl kern.tty.ptmx_max; ls /dev/ttys* | wc -l

      # Host-sshd e2e tests need localhost SSH. launchctl avoids systemsetup's
      # Full Disk Access requirement. macOS Bash 3.2 is too old to prime,
      # so the account uses zsh with a startup file instead.
      - name: Set up localhost SSH
        run: |
          set -euo pipefail
          diagnose_ssh() {
            status=$?
            set +e
            ls -ld "$HOME" "$HOME/.ssh" "$HOME/.ssh/authorized_keys"
            sudo /usr/sbin/sshd -T | grep -Ei 'authorizedkeys|pubkey|strictmodes'
            ssh -v -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=accept-new localhost true
            if [[ "$RUNNER_OS" == macOS ]]; then
              dseditgroup -o checkmember -m "$(id -un)" com.apple.access_ssh
              ls -l /etc/ssh/sshd_config.d
              sudo grep -H '^' /etc/ssh/sshd_config.d/*
              sudo log show --last 5m --style compact --predicate 'process == "sshd"' | tail -50
            else
              sudo journalctl -u ssh --no-pager -n 50
            fi
            exit "$status"
          }
          trap diagnose_ssh ERR
          if [[ "$RUNNER_OS" == Linux ]]; then
            account_home=$(getent passwd "$(id -un)" | cut -d: -f6)
            sudo systemctl start ssh
            sudo systemctl is-active --quiet ssh
          else
            account_home=$(dscl . -read "/Users/$(id -un)" NFSHomeDirectory | cut -d' ' -f2-)
            sudo chsh -s /bin/zsh "$(id -un)"
            touch "$HOME/.zshrc"
            sudo launchctl enable system/com.openssh.sshd
            if ! sudo launchctl print system/com.openssh.sshd >/dev/null 2>&1; then
              sudo launchctl bootstrap system /System/Library/LaunchDaemons/ssh.plist
            fi
            sudo launchctl print system/com.openssh.sshd
          fi
          test "$HOME" = "$account_home"
          chmod go-w "$HOME"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          if [[ ! -f "$HOME/.ssh/id_ed25519" ]]; then
            ssh-keygen -q -t ed25519 -N '' -f "$HOME/.ssh/id_ed25519"
          fi
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" > "$HOME/.ssh/id_ed25519.pub"
          touch "$HOME/.ssh/authorized_keys"
          key=$(< "$HOME/.ssh/id_ed25519.pub")
          grep -qxF "$key" "$HOME/.ssh/authorized_keys" || printf '%s\n' "$key" >> "$HOME/.ssh/authorized_keys"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/authorized_keys"
          ssh -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=accept-new localhost '
            case "$SHELL" in
              */zsh) exit 0 ;;
              */bash) "$SHELL" -c '\''(( BASH_VERSINFO[0] > 4 || (BASH_VERSINFO[0] == 4 && BASH_VERSINFO[1] >= 4) ))'\'' ;;
              *) exit 1 ;;
            esac'

      - name: E2E tests
        run: KIDO_TMUX=$HOME/tmux-side/bin/kido-tmux KIDO_E2E_REQUIRED=1 KIDO_E2E_HOST_SSH=1 make e2e

      - name: Verify ko
        if: runner.os == 'macOS'
        run: KIDO_TMUX=$HOME/tmux-side/bin/kido-tmux KO_VERUS_REQUIRED=1 make verify-ko

      # Linux has no Rust build yet: make e2e-ko runs the OCaml ko with the
      # OCaml decoder there.
      - name: Ko protocol tests
        if: runner.os == 'Linux'
        run: KIDO_TMUX=$HOME/tmux-side/bin/kido-tmux make e2e-ko

      - name: TypeScript tests
        run: KIDO_TS_TEST_REQUIRED=1 ./scripts/test-ts.sh

  # Re-verifies ko_proofs/ and diffs its extraction against the committed C
  # and OCaml, on the F* release's Linux x86_64 and Darwin arm64 binaries.
  proofs:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve F* key
        id: fstar
        run: echo "key=$(./scripts/install-fstar.sh --print-key)" >> "$GITHUB_OUTPUT"

      - name: Cache F*
        id: fstar-cache
        uses: actions/cache@v4
        with:
          path: build/fstar/${{ steps.fstar.outputs.key }}
          key: fstar-${{ runner.os }}-${{ steps.fstar.outputs.key }}

      - name: Install F*
        if: steps.fstar-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: ./scripts/install-fstar.sh "$PWD/build/fstar/${{ steps.fstar.outputs.key }}"

      - name: Cache checked files
        uses: actions/cache@v4
        with:
          path: build/fstar-checked/${{ steps.fstar.outputs.key }}
          key: fstar-checked-${{ runner.os }}-${{ steps.fstar.outputs.key }}-${{ hashFiles('ko_proofs/*.fst', 'ko_proofs/*.fsti') }}
          restore-keys: fstar-checked-${{ runner.os }}-${{ steps.fstar.outputs.key }}-

      - name: Proofs
        run: make proofs
