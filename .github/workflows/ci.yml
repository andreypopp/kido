name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  TERM: xterm-256color
  HOMEBREW_NO_AUTO_UPDATE: 1

jobs:
  test:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        timeout-minutes: 5
        uses: actions/checkout@v4
        with:
          submodules: true

      # ko_vt_sys/build.rs builds libghostty-vt with zig.
      - name: Resolve zig key
        timeout-minutes: 1
        id: zig
        run: echo "key=$(./scripts/install-zig.sh --print-key)" >> "$GITHUB_OUTPUT"

      - name: Cache zig
        timeout-minutes: 5
        id: zig-cache
        uses: actions/cache@v4
        with:
          path: ~/zig
          key: zig-${{ runner.os }}-${{ runner.arch }}-${{ steps.zig.outputs.key }}

      - name: Install zig
        if: steps.zig-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: ./scripts/install-zig.sh "$HOME/zig"

      - name: Put zig on PATH
        timeout-minutes: 1
        run: echo "$HOME/zig" >> "$GITHUB_PATH"

      # The runner images ship rustup; this installs the toolchain that
      # rust-toolchain.toml pins.
      - name: Install the Rust toolchain
        timeout-minutes: 5
        run: rustup toolchain install

      - name: Cache crates
        timeout-minutes: 5
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}

      # .cargo/config.toml keeps zig's caches here (KO_ZIG_CACHE) for every cargo profile and target directory.
      - name: Resolve ghostty pin
        timeout-minutes: 1
        id: ghostty
        run: echo "pin=$(git ls-files -s third_party/ghostty | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"

      - name: Cache libghostty-vt
        timeout-minutes: 5
        uses: actions/cache@v4
        with:
          path: target/zig-cache
          key: zig-cache-${{ runner.os }}-${{ runner.arch }}-${{ steps.ghostty.outputs.pin }}-${{ steps.zig.outputs.key }}

      - name: Download crates
        timeout-minutes: 5
        run: cargo fetch --locked

      # The Verus release archive (452 MB for arm64 macOS, 1.4 GB unpacked) that
      # `make verus` uses, keyed by the release in scripts/verus.sh.
      - name: Resolve Verus key
        timeout-minutes: 1
        id: verus
        run: echo "key=$(./scripts/verus.sh --print-key)" >> "$GITHUB_OUTPUT"

      - name: Cache Verus
        timeout-minutes: 5
        id: verus-cache
        uses: actions/cache@v4
        with:
          path: build/verus/${{ steps.verus.outputs.key }}
          key: verus-${{ runner.os }}-${{ runner.arch }}-${{ steps.verus.outputs.key }}

      - name: Fetch Verus
        if: steps.verus-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: ./scripts/verus.sh install "$PWD/build/verus/${{ steps.verus.outputs.key }}"

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          printf '%s\n' 'Acquire::Retries "3";' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' \
            | sudo tee /etc/apt/apt.conf.d/80-timeouts
          sudo apt-get update
          sudo apt-get install -y openssh-server zsh less procps
          # Debian's global compinit can block test shells with an insecure-directories prompt.
          echo 'skip_global_compinit=1' | sudo tee -a /etc/zsh/zshenv

      # The lint and ts stages need node, and a runner's preinstalled node is
      # whatever it happens to be, so pin one. verify.sh demands that the suite
      # runs (KO_TS_TEST_REQUIRED). 24 rather than the 22.18 where unflagged TypeScript
      # landed: 22.18 parses the files and then its test runner cancels the
      # suite, which this pin is how we learned.
      - name: Set up node
        uses: actions/setup-node@v4
        timeout-minutes: 5
        with:
          node-version: '24'

      # Host-sshd e2e tests need localhost SSH. launchctl avoids systemsetup's
      # Full Disk Access requirement. macOS Bash 3.2 is too old to prime,
      # so the account uses zsh with a startup file instead.
      - name: Set up localhost SSH
        timeout-minutes: 5
        run: |
          set -euo pipefail
          diagnose_ssh() {
            status=$?
            set +e
            ls -ld "$HOME" "$HOME/.ssh" "$HOME/.ssh/authorized_keys"
            sudo /usr/sbin/sshd -T | grep -Ei 'authorizedkeys|pubkey|strictmodes'
            ssh -v -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=accept-new localhost true
            if [[ "$RUNNER_OS" == macOS ]]; then
              dseditgroup -o checkmember -m "$(id -un)" com.apple.access_ssh
              ls -l /etc/ssh/sshd_config.d
              sudo grep -H '^' /etc/ssh/sshd_config.d/*
              sudo log show --last 5m --style compact --predicate 'process == "sshd"' | tail -50
            else
              sudo journalctl -u ssh --no-pager -n 50
            fi
            exit "$status"
          }
          trap diagnose_ssh ERR
          if [[ "$RUNNER_OS" == Linux ]]; then
            account_home=$(getent passwd "$(id -un)" | cut -d: -f6)
            sudo systemctl start ssh
            sudo systemctl is-active --quiet ssh
          else
            account_home=$(dscl . -read "/Users/$(id -un)" NFSHomeDirectory | cut -d' ' -f2-)
            sudo chsh -s /bin/zsh "$(id -un)"
            touch "$HOME/.zshrc"
            sudo launchctl enable system/com.openssh.sshd
            if ! sudo launchctl print system/com.openssh.sshd >/dev/null 2>&1; then
              sudo launchctl bootstrap system /System/Library/LaunchDaemons/ssh.plist
            fi
            sudo launchctl print system/com.openssh.sshd
          fi
          test "$HOME" = "$account_home"
          chmod go-w "$HOME"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          if [[ ! -f "$HOME/.ssh/id_ed25519" ]]; then
            ssh-keygen -q -t ed25519 -N '' -f "$HOME/.ssh/id_ed25519"
          fi
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" > "$HOME/.ssh/id_ed25519.pub"
          touch "$HOME/.ssh/authorized_keys"
          key=$(< "$HOME/.ssh/id_ed25519.pub")
          grep -qxF "$key" "$HOME/.ssh/authorized_keys" || printf '%s\n' "$key" >> "$HOME/.ssh/authorized_keys"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/authorized_keys"
          ssh -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=accept-new localhost '
            case "$SHELL" in
              */zsh) exit 0 ;;
              */bash) "$SHELL" -c '\''(( BASH_VERSINFO[0] > 4 || (BASH_VERSINFO[0] == 4 && BASH_VERSINFO[1] >= 4) ))'\'' ;;
              *) exit 1 ;;
            esac'

      - name: Pull the Podman test image
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: podman pull docker.io/library/debian:trixie

      - name: Verify
        env:
          KO_E2E_PODMAN: ${{ runner.os == 'Linux' && '1' || '0' }}
        timeout-minutes: 35
        run: KO_VERUS_REQUIRED=1 KO_E2E_HOST_SSH=1 make verify

      - name: Install
        timeout-minutes: 10
        run: make install PREFIX=$HOME/ko-install && $HOME/ko-install/bin/ko version && test -x $HOME/ko-install/share/ko/bin/ko
