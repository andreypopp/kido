#!/usr/sbin/nft -f
flush ruleset
table inet filter {
	set ssh4 {
		type ipv4_addr
		flags interval
		elements = { @SSH4@ }
	}
	set ssh6 {
		type ipv6_addr
		flags interval
		elements = { @SSH6@ }
	}
	chain input {
		type filter hook input priority 0; policy drop;
		iifname lo accept
		ct state established,related accept
		ct state invalid drop
		ip protocol icmp icmp type { destination-unreachable, time-exceeded, parameter-problem } accept
		meta l4proto ipv6-icmp icmpv6 type { destination-unreachable, packet-too-big, time-exceeded, parameter-problem, nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert } accept
		ip saddr @ssh4 tcp dport 22 accept
		ip6 saddr @ssh6 tcp dport 22 accept
		tcp dport 443 accept
	}
	chain forward {
		type filter hook forward priority 0; policy drop;
	}
	chain output {
		type filter hook output priority 0; policy accept;
	}
}
