#cloud-config
disable_root: true
ssh_pwauth: false
ssh_deletekeys: true
ssh_keys:
  ed25519_private: ${host_key}
  ed25519_public: ${host_key_pub}
packages: [rsync]
users:
  - name: me
    groups: [sudo]
    shell: /bin/bash
    lock_passwd: true
    sudo: ALL=(ALL) NOPASSWD:ALL
    ssh_authorized_keys:
      - ${ssh_key}
runcmd:
  - [passwd, -l, root]
