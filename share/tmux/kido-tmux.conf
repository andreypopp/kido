# kido's tmux defaults: the side column and the keys around it. The
# launcher writes this file ahead of the user's own ~/.config/kido/kido.conf,
# so anything here can be overridden there.

set -g side-status left
set -g side-status-width 40
set -g side-status-style "fg=default,bg=default"
set -g side-status-command "kido"
set -g mouse on
set -s get-clipboard request

# tmux's bindings keep the width per session; kido keeps it global.
bind-key -n MouseDrag1StatusBorder { if -F '#{e|>=:#{client_width},3}' { run -C "set -g side-status-width #{?#{==:#{side-status},left},#{e|+:#{?#{e|<:#{mouse_absolute_x},1},1,#{?#{e|>:#{mouse_absolute_x},#{e|-:#{client_width},2}},#{e|-:#{client_width},2},#{mouse_absolute_x}}},1},#{e|-:#{client_width},#{?#{e|<:#{mouse_absolute_x},1},1,#{?#{e|>:#{mouse_absolute_x},#{e|-:#{client_width},2}},#{e|-:#{client_width},2},#{mouse_absolute_x}}}}}" } }
bind-key -n DoubleClick1StatusBorder { set -g side-status-width 40 }

bind-key K if-shell -F '#{==:#{side-status},off}' \
  'set -g side-status left ; refresh-client -f side-status-focus' \
  'set -g side-status off'

bind-key k if-shell -F '#{m:*side-status-focus*,#{client_flags}}' \
  'refresh-client -f !side-status-focus' \
  'refresh-client -f side-status-focus'

# Unlike tmux's own next-window/previous-window, crosses session boundaries.
bind-key -n S-Up   run-shell "kido switch-window prev --client '#{client_name}'"
bind-key -n S-Down run-shell "kido switch-window next --client '#{client_name}'"

# display-popup does not expand formats in its command, and a popup has
# no client of its own, so run-shell expands #{client_name} and it is
# passed to both the popup and kido.
bind-key -n C-s if-shell -F '#{==:#{side-status},off}' {
  run-shell -b "tmux -u display-popup -c '#{client_name}' -E -w 40 -h 96% -x 1 -y '#{e|+:#{e|/:#{e|*:#{client_height},96},100},1}' 'kido --client #{client_name}'"
} {
  if-shell -F '#{m:*side-status-focus*,#{client_flags}}' 'refresh-client -f !side-status-focus' 'refresh-client -f side-status-focus'
}
