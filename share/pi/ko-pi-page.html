<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>pi</title>
  <style>
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--ko-bg);
      color: var(--ko-fg);
      font: var(--ko-font-size)/1.65 -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      flex-direction: column;
    }
    button, textarea { font: inherit; color: inherit; }
    button {
      border: 1px solid color-mix(in srgb, var(--ko-fg) 18%, var(--ko-bg));
      border-radius: 7px;
      background: var(--ko-bg);
      padding: 5px 12px;
      cursor: pointer;
    }
    button:hover { background: color-mix(in srgb, var(--ko-fg) 7%, var(--ko-bg)); }
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 22px;
      border-bottom: 1px solid color-mix(in srgb, var(--ko-fg) 12%, var(--ko-bg));
      flex-shrink: 0;
    }
    #name { font-weight: 650; }
    #model, #status, .label, .muted {
      color: color-mix(in srgb, var(--ko-fg) 55%, var(--ko-bg));
    }
    #status { margin-left: auto; font-size: .85em; }
    main { overflow: auto; flex: 1; scrollbar-gutter: stable; }
    #transcript { max-width: 920px; margin: auto; padding: 18px 26px 30px; }
    .item { padding: 16px 0; }
    .label {
      font-size: .75em;
      font-weight: 650;
      text-transform: uppercase;
      letter-spacing: .08em;
      margin-bottom: 7px;
    }
    .user {
      background: color-mix(in srgb, var(--ko-color-4) 8%, var(--ko-bg));
      border-radius: 10px;
      padding: 14px 18px;
      margin: 12px -18px;
    }
    .user .label { color: var(--ko-color-4); }
    p { margin: .5em 0 1em; }
    h1, h2, h3, h4, h5, h6 { line-height: 1.35; margin: 1em 0 .5em; font-size: 1.2em; }
    h1 { font-size: 1.5em; }
    ul, ol { padding-left: 24px; }
    pre, code { font-family: var(--ko-font-family); font-size: .9em; }
    code {
      background: color-mix(in srgb, var(--ko-fg) 7%, var(--ko-bg));
      border-radius: 4px;
      padding: 2px 5px;
    }
    pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      margin: 8px 0;
      padding: 14px;
      border-radius: 8px;
      background: color-mix(in srgb, var(--ko-fg) 5%, var(--ko-bg));
      line-height: 1.55;
    }
    pre code { padding: 0; background: none; }
    details {
      margin: 9px 0;
      border: 1px solid color-mix(in srgb, var(--ko-fg) 12%, var(--ko-bg));
      border-radius: 8px;
      padding: 8px 12px;
    }
    summary { cursor: pointer; overflow-wrap: anywhere; }
    .thinking { color: color-mix(in srgb, var(--ko-fg) 55%, var(--ko-bg)); font-size: .9em; }
    .thinking pre { max-height: 220px; overflow: auto; }
    .tool summary { color: var(--ko-color-4); font: .9em/1.5 var(--ko-font-family); }
    .tool-mark { margin-right: 8px; }
    .tool .args { color: var(--ko-fg); }
    .error { color: var(--ko-color-1); }
    .notice {
      border-left: 2px solid color-mix(in srgb, var(--ko-color-4) 45%, var(--ko-bg));
      padding: 8px 16px;
      margin: 12px 0;
      font-size: .9em;
    }
    .plain { white-space: pre-wrap; overflow-wrap: anywhere; }
    .cut { font-size: .8em; opacity: .6; }
    footer {
      flex-shrink: 0;
      border-top: 1px solid color-mix(in srgb, var(--ko-fg) 12%, var(--ko-bg));
      padding: 14px 22px;
    }
    #composer { max-width: 920px; margin: auto; }
    textarea {
      display: block;
      width: 100%;
      resize: none;
      min-height: 70px;
      max-height: 220px;
      overflow-y: auto;
      background: color-mix(in srgb, var(--ko-fg) 3%, var(--ko-bg));
      border: 1px solid color-mix(in srgb, var(--ko-fg) 17%, var(--ko-bg));
      border-radius: 9px;
      padding: 12px;
      outline: none;
    }
    textarea:focus { border-color: var(--ko-color-4); }
    .actions { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
    .hint { font-size: .75em; opacity: .5; flex: 1; }
    #send { background: var(--ko-fg); color: var(--ko-bg); }
    #error { color: var(--ko-color-1); font-size: .85em; }
    #older { display: block; margin: 0 auto; border: 0; font-size: .85em; }
  </style>
</head>
<body>
  <header>
    <span id="name">pi</span>
    <span id="model"></span>
    <span id="status">Connecting…</span>
    <button id="terminal">Terminal</button>
  </header>
  <main id="scroll">
    <div id="transcript">
      <button id="older" hidden>Load earlier messages</button>
      <div id="items"></div>
    </div>
  </main>
  <footer>
    <div id="composer">
      <textarea id="prompt" rows="2" placeholder="Message pi…" aria-label="Message pi"></textarea>
      <div id="error" role="alert"></div>
      <div class="actions">
        <span class="hint">Enter to send · ⌥ Enter follow-up · ⇧ Enter new line</span>
        <button id="stop" hidden>Stop</button>
        <button id="send">Send</button>
      </div>
    </div>
  </footer>
  <script>
    const entries = new Map();
    let epoch = '';
    let after = -1;
    let first;
    let more = false;
    let paging = false;
    let follow = true;
    let delay = 200;
    let scrollFrame;
    let disconnected = false;

    function element(id) {
      return document.getElementById(id);
    }

    function node(tag, text, className) {
      const result = document.createElement(tag);
      if (text !== undefined) result.textContent = text;
      if (className) result.className = className;
      return result;
    }

    function inline(parent, text) {
      const pattern = /(`[^`]+`|\*\*[^*]+\*\*|\*[^*]+\*)/g;
      let start = 0;
      for (const match of text.matchAll(pattern)) {
        parent.append(document.createTextNode(text.slice(start, match.index)));
        const source = match[0];
        const tag = source[0] === '`' ? 'code' : source.startsWith('**') ? 'strong' : 'em';
        const cut = tag === 'strong' ? 2 : 1;
        parent.append(node(tag, source.slice(cut, -cut)));
        start = match.index + source.length;
      }
      parent.append(document.createTextNode(text.slice(start)));
    }

    function markdown(text) {
      const root = node('div');
      const lines = text.split('\n');
      let paragraph = null;
      let list = null;
      for (let index = 0; index < lines.length; index++) {
        const line = lines[index];
        if (line.startsWith('```')) {
          const pre = node('pre');
          const code = node('code');
          const value = [];
          while (++index < lines.length && !lines[index].startsWith('```')) value.push(lines[index]);
          code.textContent = value.join('\n');
          pre.append(code);
          root.append(pre);
          paragraph = list = null;
          continue;
        }
        const heading = line.match(/^(#{1,6})\s+(.+)/);
        const item = line.match(/^\s*(?:[-*]|\d+\.)\s+(.+)/);
        if (heading) {
          const title = node('h' + heading[1].length);
          inline(title, heading[2]);
          root.append(title);
          paragraph = list = null;
        } else if (item) {
          if (!list) {
            list = node(/^\s*\d/.test(line) ? 'ol' : 'ul');
            root.append(list);
          }
          const child = node('li');
          inline(child, item[1]);
          list.append(child);
          paragraph = null;
        } else if (!line.trim()) {
          paragraph = list = null;
        } else {
          list = null;
          if (!paragraph) {
            paragraph = node('p');
            root.append(paragraph);
          } else paragraph.append(document.createTextNode('\n'));
          inline(paragraph, line);
        }
      }
      return root;
    }

    function capped(parent, value, className) {
      if (!value) return;
      parent.append(node('pre', value.text, className));
      if (value.cut) parent.append(node('div', value.cut + ' bytes omitted', 'cut'));
    }

    function renderBlock(block, item, previous, labelThinking = true) {
      if (block.type === 'text') return markdown(block.text);
      const details = node('details', undefined, block.type === 'thinking' ? 'thinking' : 'tool');
      if (block.type === 'thinking') {
        const summary = node('summary');
        if (labelThinking) summary.textContent = thinkingLabel(block, item);
        details.append(summary, node('pre', block.text));
        details.open = previous?.open ?? false;
      } else {
        const summary = node('summary');
        const state = block.state;
        const running = state.type === 'running';
        const error = state.type === 'done' && state.error;
        summary.append(node('span', running ? '◌' : error ? '!' : state.type === 'not_run' ? '–' : '›', 'tool-mark' + (error ? ' error' : '')));
        summary.append(document.createTextNode(block.name + ' '));
        const oneLine = block.args.text.replaceAll('\n', ' ');
        const shortened = oneLine.length > 100 || block.args.text.includes('\n') || block.args.cut > 0;
        summary.append(node('span', oneLine.slice(0, 100) + (oneLine.length > 100 ? '…' : ''), 'args'));
        details.append(summary);
        if (shortened) capped(details, block.args, 'args');
        if (state.type === 'running' || state.type === 'done') capped(details, state.result, error ? 'error' : undefined);
        if (state.type === 'not_run') details.append(node('div', 'Not run', 'muted'));
        details.open = running || error || (previous?.dataset.state !== 'running' && (previous?.open ?? false));
        details.dataset.state = state.type;
      }
      return details;
    }

    function thinkingLabel(block, item) {
      if (block.redacted) return 'Thinking (redacted)';
      if (item.final) return 'Thinking';
      let end = block.text.length;
      while (end > 0 && block.text[end - 1] === '\n') end--;
      const tail = block.text.slice(block.text.lastIndexOf('\n', end - 1) + 1, end);
      return 'Thinking · ' + tail.slice(-90);
    }

    function renderMetadata(entry) {
      entry.metadata.replaceChildren();
      if (entry.item.error) entry.metadata.append(node('div', entry.item.error, 'error plain'));
      else if (entry.item.stop === 'aborted') entry.metadata.append(node('div', 'Turn stopped', 'muted'));
    }

    function renderItem(item, previous) {
      const view = node('article', undefined, 'item ' + item.kind);
      const entry = { item, view, blocks: [], metadata: node('div') };
      if (item.kind === 'user') {
        view.append(node('div', 'You', 'label'), node('div', item.text, 'plain'));
        if (item.images) view.append(node('div', item.images + ' image(s)', 'muted'));
      } else if (item.kind === 'assistant') {
        entry.blocks = item.blocks.map((block, index) => renderBlock(block, item, previous?.blocks[index]));
        view.append(...entry.blocks, entry.metadata);
        renderMetadata(entry);
      } else if (item.kind === 'notice') {
        view.append(node('div', item.from || item.customType, 'label'), node('div', item.text, 'plain'));
      } else if (item.kind === 'bash') {
        view.append(node('div', '$ ' + item.command, 'plain'));
        capped(view, item.output);
        view.append(node('div', 'Exit ' + (item.exit ?? 'unknown'), 'muted'));
      } else view.append(node('div', 'Summary', 'label'), node('div', item.text, 'plain'));
      return entry;
    }

    function advanceCursor() {
      if (first === undefined) return;
      if (after < first - 1) after = first - 1;
      for (;;) {
        const next = entries.get(after + 1);
        if (!next?.item.final) return;
        after++;
      }
    }

    function put(item, prepend = false) {
      const previous = entries.get(item.seq);
      const entry = renderItem(item, previous);
      if (previous) previous.view.replaceWith(entry.view);
      else if (prepend) element('items').prepend(entry.view);
      else element('items').append(entry.view);
      entries.set(item.seq, entry);
      first = first === undefined ? item.seq : Math.min(first, item.seq);
      advanceCursor();
    }

    function patch(record) {
      const entry = entries.get(record.seq);
      if (!entry) return;
      Object.assign(entry.item, { final: record.final, stop: record.stop, error: record.error });
      for (const change of record.blocks) {
        const old = entry.blocks[change.index];
        if (change.block) entry.item.blocks[change.index] = change.block;
        else entry.item.blocks[change.index].text += change.suffix;
        const block = entry.item.blocks[change.index];
        if (change.suffix !== undefined && block.type === 'thinking') {
          old.querySelector('pre').append(document.createTextNode(change.suffix));
        } else {
          const next = renderBlock(block, entry.item, old, false);
          old.replaceWith(next);
          entry.blocks[change.index] = next;
        }
      }
      entry.item.blocks.forEach((block, index) => {
        if (block.type === 'thinking') entry.blocks[index].querySelector('summary').textContent = thinkingLabel(block, entry.item);
      });
      renderMetadata(entry);
      advanceCursor();
    }

    function apply(record) {
      if (record.type === 'reset') {
        epoch = record.epoch;
        after = -1;
        first = undefined;
        entries.clear();
        element('items').replaceChildren();
        more = record.more;
        record.items.forEach(item => put(item));
        element('older').hidden = !more;
      } else if (record.type === 'item') put(record.item);
      else if (record.type === 'patch') patch(record);
      else if (record.type === 'state') {
        element('name').textContent = record.name || 'pi';
        element('model').textContent = record.model;
        element('status').textContent = record.working ? 'Working' : 'Ready';
        element('stop').hidden = !record.working;
      }
    }

    function followBottom() {
      if (scrollFrame !== undefined) return;
      scrollFrame = requestAnimationFrame(() => {
        scrollFrame = undefined;
        if (follow) element('scroll').scrollTop = element('scroll').scrollHeight;
      });
    }

    async function connect() {
      try {
        const response = await fetch('/events?epoch=' + encodeURIComponent(epoch) + '&after=' + after);
        if (!response.ok) throw Error('Connection failed');
        if (disconnected) element('error').textContent = '';
        disconnected = false;
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let partial = '';
        delay = 200;
        for (;;) {
          const { value, done } = await reader.read();
          if (done) break;
          partial += decoder.decode(value, { stream: true });
          let end, offset = 0;
          while ((end = partial.indexOf('\n', offset)) >= 0) {
            const line = partial.slice(offset, end);
            offset = end + 1;
            if (line) apply(JSON.parse(line));
          }
          partial = partial.slice(offset);
          followBottom();
        }
      } catch (error) {
        disconnected = true;
        element('error').textContent = 'Connection lost. Reconnecting…';
      }
      element('status').textContent = 'Reconnecting…';
      setTimeout(connect, delay);
      delay = Math.min(delay * 2, 5000);
    }

    async function older() {
      if (!more || paging || first === undefined) return;
      paging = true;
      const scroll = element('scroll');
      const anchor = entries.get(first)?.view;
      const top = anchor?.getBoundingClientRect().top;
      try {
        const response = await fetch('/items?before=' + first);
        if (!response.ok) throw Error('Could not load earlier messages');
        const result = await response.json();
        if (result.epoch === epoch) {
          for (const item of result.items.toReversed()) put(item, true);
          more = result.more;
          element('older').hidden = !more;
          if (anchor && top !== undefined) scroll.scrollTop += anchor.getBoundingClientRect().top - top;
        }
      } catch (error) {
        element('error').textContent = error.message;
      } finally {
        paging = false;
      }
    }

    async function post(path, body) {
      const response = await fetch(path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body ?? {}),
      });
      if (!response.ok) {
        let result;
        try { result = await response.json(); } catch {}
        throw Error(result?.error || 'Request failed');
      }
    }

    function growPrompt() {
      const input = element('prompt');
      input.style.height = 'auto';
      input.style.height = Math.min(parseFloat(getComputedStyle(input).maxHeight), input.scrollHeight + 2) + 'px';
    }

    async function send(mode = 'steer') {
      const input = element('prompt');
      const text = input.value;
      if (!text.trim()) return;
      try {
        await post('/prompt', { text, mode });
        if (input.value === text) input.value = '';
        growPrompt();
        element('error').textContent = '';
      } catch (error) {
        element('error').textContent = error.message;
      }
    }

    function reportError(error) {
      element('error').textContent = error.message;
    }

    element('send').onclick = () => send();
    element('terminal').onclick = () => post('/terminal').catch(reportError);
    element('stop').onclick = () => post('/abort').catch(reportError);
    element('older').onclick = older;
    element('prompt').addEventListener('input', growPrompt);
    element('prompt').addEventListener('keydown', event => {
      if (event.isComposing) return;
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        send(event.altKey ? 'follow_up' : 'steer');
      }
    });
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') {
        event.preventDefault();
        post('/abort').catch(reportError);
      }
    });
    element('scroll').addEventListener('scroll', () => {
      const scroll = element('scroll');
      follow = scroll.scrollHeight - scroll.scrollTop - scroll.clientHeight < 60;
      if (scroll.scrollTop < 80) older();
    });
    growPrompt();
    connect();
  </script>
</body>
</html>
