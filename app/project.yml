name: Kido
options:
  bundleIdPrefix: com.andreypopp
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_ACTIVE_COMPILATION_CONDITIONS: ["$(inherited)", "$(KIDO_STRESS_CONDITION)", "$(KIDO_VISUAL_CONDITION)"]
    ARCHS: arm64
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: ["$(inherited)", DEBUG, "$(KIDO_STRESS_CONDITION)", "$(KIDO_VISUAL_CONDITION)"]
    Release:
      DEBUG_INFORMATION_FORMAT: dwarf
      CODE_SIGN_IDENTITY: Apple Development
      DEVELOPMENT_TEAM: LC2633WWXE
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
      ENABLE_HARDENED_RUNTIME: NO
settingGroups:
  KoClientSlice:
    KO_CLIENT_SLICE: "$(SRCROOT)/build/ko_client.xcframework/macos-arm64_x86_64"
    SWIFT_INCLUDE_PATHS: "$(KO_CLIENT_SLICE)/Headers"
    LIBRARY_SEARCH_PATHS: "$(KO_CLIENT_SLICE)"
    OTHER_LDFLAGS: [-lko_client, -lc++]
packages:
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    exactVersion: 1.18.7
  TmuxControl:
    path: Packages/TmuxControl
  SidebarFeed:
    path: Packages/SidebarFeed
  PromptMarkdown:
    path: Packages/PromptMarkdown
targets:
  Kido:
    type: application
    platform: macOS
    sources:
      - App
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: Resources/ghostty
        type: folder
        buildPhase: resources
    info:
      path: build/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.andreypopp.kido.connect
            CFBundleURLSchemes: [kido-app]
    settings:
      base:
        KIDO_PRODUCT_NAME: Kido
        PRODUCT_NAME: "$(KIDO_PRODUCT_NAME)"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LM_SKIP_METADATA_EXTRACTION: NO
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "0.1.0"
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        INFOPLIST_KEY_CFBundleDisplayName: Kido
        OTHER_LDFLAGS: [-lc++]
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.andreypopp.kido.debug
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.andreypopp.kido
    postBuildScripts:
      - name: Bundle kido
        script: python3 "$SRCROOT/scripts/bundle-kido.py"
        basedOnDependencyAnalysis: false
    dependencies:
      - package: TmuxControl
      - package: SidebarFeed
      - package: PromptMarkdown
      - framework: build/GhosttyKit.xcframework
        embed: false
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: IOSurface.framework
      - sdk: Carbon.framework
  VisualTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: VisualTests
        excludes: ["__Snapshots__"]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Kido.app/Contents/MacOS/Kido"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: Kido
      - sdk: Carbon.framework
      - package: SnapshotTesting
      - package: TmuxControl
      - package: SidebarFeed
      - package: PromptMarkdown
        link: false
      - framework: build/GhosttyKit.xcframework
        embed: false
        link: false
  KoProbe:
    type: tool
    platform: macOS
    sources:
      - path: KoProbe
    settings:
      groups: [KoClientSlice]
      base:
        PRODUCT_NAME: ko-probe
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    preBuildScripts:
      - name: Build ko_client
        script: |
          set -eu
          : "${KO_CHECKOUT:?set KO_CHECKOUT to the kido-rust checkout}"
          env -i HOME="$HOME" PATH=/usr/bin:/bin:/usr/sbin:/sbin DEVELOPER_DIR="$DEVELOPER_DIR" MACOSX_DEPLOYMENT_TARGET="$MACOSX_DEPLOYMENT_TARGET" \
            make -C "$KO_CHECKOUT" ko-client-xcframework KO_CLIENT_XC="$SRCROOT/build/ko_client.xcframework"
        basedOnDependencyAnalysis: false
    dependencies:
      - framework: build/GhosttyKit.xcframework
        embed: false
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: IOSurface.framework
      - sdk: Carbon.framework
  KoProbeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: KoProbeTests
      - path: KoProbe/KoConnection.swift
    settings:
      groups: [KoClientSlice]
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: KoProbe
        link: false
      - framework: build/GhosttyKit.xcframework
        embed: false
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: IOSurface.framework
      - sdk: Carbon.framework
schemes:
  KoProbe:
    build:
      targets:
        KoProbe: all
        KoProbeTests: [test]
    test:
      targets: [KoProbeTests]
  Kido:
    build:
      targets:
        Kido: all
  Visual:
    build:
      targets:
        Kido: all
        VisualTests: [test]
    test:
      targets: [VisualTests]
      environmentVariables:
        KIDO_APP_BACKGROUND: "1"
        DYLD_INSERT_LIBRARIES: "$(SRCROOT)/build/bundle/visual/renderer-probes.dylib"
        KIDO_APP_SERVER: "$(KIDO_VISUAL_SERVER)"
        HOME: "$(SRCROOT)/build/bundle/visual/home"
        XDG_STATE_HOME: "$(SRCROOT)/build/bundle/visual/state"
        TMUX_TMPDIR: "$(SRCROOT)/build/bundle/visual/tmp"
        XDG_CONFIG_HOME: "$(SRCROOT)/build/bundle/visual/home/.config"
        KIDO_VISUAL_RECORD: "$(KIDO_VISUAL_RECORD)"
        KIDO_VSYNC_MEASURE: "$(KIDO_VSYNC_MEASURE)"
        KIDO_VISUAL_TMUX: "$(KIDO_VISUAL_TMUX)"
