[project]
name = "kido-questions-ml"
version = "0.0.0"
description = "Question extractor for Kido: data pipeline, labelling, taggers"
requires-python = ">=3.12,<3.13"
dependencies = [
  "markdown-it-py>=3.0",
  "openai>=1.60",
  "torch>=2.6",
  "transformers>=4.56",
]

[project.scripts]
extract = "extract:main"
label = "label_cli:main"
label-corpus = "label_corpus:main"
report = "report:main"
train = "train:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = [
  "corpus.py", "deepseek.py", "evaluate.py", "extract.py", "jsonl.py", "label.py",
  "label_cli.py", "label_corpus.py", "model.py", "normalise.py", "redact.py", "report.py",
  "tagging.py", "train.py", "transcripts.py", "units.py",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["data", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
