[package]
name = "fuzz"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[package.metadata]
cargo-fuzz = true

[dependencies]
ko_pane = { path = "../ko_pane" }
ko_pane_wire = { path = "../ko_pane_wire", features = ["fuzz"] }
ko_server = { path = "../ko_server", features = ["fuzz"] }
ko_sys = { path = "../ko_sys", features = ["fuzz"] }
libfuzzer-sys = "0.4"

[[bin]]
name = "frame"
path = "fuzz_targets/frame.rs"
test = false
doc = false
bench = false

